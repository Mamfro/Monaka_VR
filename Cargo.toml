[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
# A game pack carries its crate's `repository` as where it comes from (`monaka_contract::pack::About`).
repository = "https://github.com/Mamfro/monaka_vr"

[workspace.dependencies]
# The SDK's crates the host uses, from the monaka_sdk checkout beside this one.
monaka_channel = { path = "../monaka_sdk/crates/channel" }
monaka_contract = { path = "../monaka_sdk/crates/contract" }
monaka_core = { path = "../monaka_sdk/crates/core" }
monaka_launch = { path = "crates/launch" }
monaka_openxr = { path = "crates/openxr" }
monaka_overlay = { path = "crates/overlay" }
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Code that runs inside a game must never unwind into the game's frames.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Small edits rebuild in seconds (each crate recompiles only what changed).
incremental = true
