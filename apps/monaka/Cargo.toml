[package]
name = "monaka"
description = "The monaka window: pick a game, set its options, start VR. Also monaka_play, the same from the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "monaka"
path = "src/main.rs"

[[bin]]
name = "monaka_play"
path = "src/play.rs"

[dependencies]
monaka_channel.workspace = true
monaka_core.workspace = true
monaka_launch.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit"] }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
]

[lints]
workspace = true
