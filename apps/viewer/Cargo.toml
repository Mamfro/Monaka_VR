[package]
name = "monaka_viewer"
description = "Shows a game's stereo pairs in the headset through OpenXR, with head tracking written back to the game."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
monaka_contract.workspace = true
monaka_core.workspace = true
monaka_channel.workspace = true
monaka_openxr.workspace = true
monaka_overlay.workspace = true
jpeg-encoder = "0.7"

[dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"]

[lints]
workspace = true
