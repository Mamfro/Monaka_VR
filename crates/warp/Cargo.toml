[package]
name = "monaka_warp"
description = "Depth reprojection on the GPU: frames redrawn from another camera, a HUD layer over each eye, motion vectors from depth (D3D11), and two eyes warped from one frame and its depth (D3D12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
monaka_core.workspace = true
monaka_channel.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[lints]
workspace = true
