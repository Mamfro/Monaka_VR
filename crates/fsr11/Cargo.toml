[package]
name = "monaka_fsr11"
description = "AMD FSR upscaling for D3D11 games: motion vectors from depth and the eye cameras, upscaled on a private D3D12 device through shared textures and a shared fence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
monaka_core.workspace = true
monaka_channel.workspace = true
monaka_ffx.workspace = true
monaka_producer.workspace = true
monaka_warp.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[lints]
workspace = true
