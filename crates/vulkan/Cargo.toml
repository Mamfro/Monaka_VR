[package]
name = "monaka_vulkan"
description = "Vulkan games' frames out to Monaka: the game's device made with the sharing extensions, each present's images copied into buffers a D3D12 device of Monaka's own reads, synchronised by shared fences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
monaka_contract.workspace = true
monaka_core.workspace = true
monaka_channel.workspace = true
monaka_hook.workspace = true
monaka_producer.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]

[lints]
workspace = true
