[package]
name = "monaka_overlay"
description = "What the viewer draws over the eyes: debug lines, image views of the eyes and their depth, and the in-headset debug menu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
monaka_contract.workspace = true
monaka_core.workspace = true
monaka_channel.workspace = true
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
